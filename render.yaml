# SentryHub (Next.js API + optional web) on Render
# Docs: https://render.com/docs/deploy-nextjs-app
#
# Bind to 0.0.0.0:$PORT (Next.js `next start` does this when PORT is set by Render).
# Ephemeral filesystem — do not rely on local disk for uploads (Mux holds media).

services:
  - type: web
    name: sentryhub-api
    runtime: node
    plan: free
    region: oregon
    rootDir: sentryhub
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VIDEO_PROVIDER
        value: mux
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: NOTIFY_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RESEND_API_KEY
        sync: false
